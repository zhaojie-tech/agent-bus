name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # redaction gate also scans commit messages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Trusted-publishing checklist: tag must equal the package version
      - name: Verify tag == package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG_VER"
          test "$TAG" = "$PKG_VER" || { echo "::error::tag v$TAG != package $PKG_VER"; exit 1; }
      - name: Run test gates
        run: |
          python -m pip install -e ".[dev]"
          pytest tests/ -q
          ruff check src/ tests/ scripts/ && ruff format --check src/ tests/ scripts/
          mypy
          python scripts/check_forbidden_words.py --git-history
          python scripts/check_zero_deps.py
          python scripts/gen_cli_docs.py --check

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
          agentbus version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # PyPI trusted publishing: create the pending publisher on PyPI before the
    # first release — project 'local-agent-bus', owner/repo
    # zhaojie-tech/agent-bus, workflow release.yml, environment pypi
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      # id-token 用于 trusted publishing；其余最小化
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            See [CHANGELOG.md](https://github.com/zhaojie-tech/agent-bus/blob/main/CHANGELOG.md)
            and [docs/protocol-v3.md](https://github.com/zhaojie-tech/agent-bus/blob/main/docs/protocol-v3.md).
